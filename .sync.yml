# This file can be used to customize the files managed by PDK.
#
# See https://github.com/puppetlabs/pdk-templates/blob/main/README.md
# for more information.
#
# See https://github.com/puppetlabs/pdk-templates/blob/main/config_defaults.yml
# for the default values.
---
common:

".gitlab-ci.yml":
  delete: true
appveyor.yml:
  delete: true
.gitpod.Dockerfile:
  unmanaged: true
.gitpod.yml:
  unmanaged: true
.github/workflows/nightly.yml:
  unmanaged: true
.github/workflows/pr_test.yml:
  unmanaged: true
.github/workflows/auto_release.yml:
  unmanaged: true
.github/workflows/spec.yml:
  checks: 'syntax lint metadata_lint check:symlinks check:git_ignore check:dot_underscore check:test_file rubocop'
  unmanaged: true
.github/workflows/release.yml:
  unmanaged: true
.travis.yml:
  delete: true
spec/spec_helper.rb:
  mock_with: ":rspec"
  coverage_report: true
Rakefile:
  unmanaged: true
  changelog_user: "puppetlabs"
  extra_disabled_lint_checks:
    - 'lookup_in_parameter'
spec/default_facts.yml:
  extra_facts:
    pe_build: '2021.5.0'
    identity:
      user: 'root'
    settings:
      module_groups: 'base+pe_only'
    pe_postgresql_info:
      installed_server_version: '14'
    networking:
      fqdn: 'foo.bar.com'
.rubocop.yml:
  # Cops the previous PDK template disabled, kept disabled to preserve this module's established style
  cop_overrides:
    "Layout/MultilineOperationIndentation":
       Enabled: False
    "Layout/HashAlignment":
      Enabled: False
    "Layout/LeadingEmptyLines":
      Enabled: False
    "Lint/HashCompareByIdentity":
      Enabled: False
    "Metrics/AbcSize":
      Enabled: False
    "Metrics/ClassLength":
      Enabled: False
    "Metrics/CyclomaticComplexity":
      Enabled: False
    "Metrics/MethodLength":
      Enabled: False
    "Metrics/PerceivedComplexity":
      Enabled: False
    "Performance/CollectionLiteralInLoop":
      Enabled: False
    "RSpec/ContextWording":
      Enabled: False
    "RSpec/EmptyLineAfterExample":
      Enabled: False
    "RSpec/EmptyLineAfterExampleGroup":
      Enabled: False
    "RSpec/ExampleLength":
      Enabled: False
    "RSpec/ExcessiveDocstringSpacing":
      Enabled: False
    "RSpec/ImplicitSubject":
      Enabled: False
    "RSpec/MessageSpies":
      EnforcedStyle: receive
    "RSpec/MultipleExpectations":
      Enabled: False
    "RSpec/MultipleMemoizedHelpers":
      Enabled: False
    "RSpec/NestedGroups":
      Enabled: False
    "RSpec/NoExpectationExample":
      Enabled: False
    "Style/FetchEnvVar":
      Enabled: False
    "Style/FrozenStringLiteralComment":
      Enabled: False
    "Style/IfUnlessModifier":
      Enabled: False
    "Style/MixinUsage":
      Enabled: False
    "Style/RedundantArgument":
      Enabled: False
    "Style/RescueStandardError":
      Enabled: False
    "Style/StderrPuts":
      Enabled: False
    "Style/StringConcatenation":
      Enabled: False
    "Style/TrailingCommaInHashLiteral":
      Enabled: False
Gemfile:
  optional:
    ":development":
    - gem: github_changelog_generator
      version: '= 1.16.4'
    - gem: 'toml-rb'
