name: "Spec Tests"

on:
  workflow_dispatch:
  workflow_call:

env:
  SHELLCHECK_OPTS: '-e SC1090 -e SC1091'

jobs:
  # Builds the Puppet 8 (Ruby 3.2) and Puppet 9 (Ruby 4.0) matrix from metadata.json and installs
  # the puppetcore gems using the PUPPET_FORGE_TOKEN (or PUPPET_FORGE_TOKEN_PUBLIC) secret
  Spec:
    uses: "puppetlabs/cat-github-actions/.github/workflows/module_ci.yml@main"
    with:
      # patron (a transitive dependency of puppet_litmus) needs libcurl headers to build its native extension
      additional_packages: "libcurl4-openssl-dev"
      # voxpupuli-puppet-lint-plugins ~> 7.0 needs Ruby >= 3.2 for the matrix setup job
      ruby_version: "3.2"
    secrets: "inherit"

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run ShellCheck
      uses: ludeeus/action-shellcheck@master
